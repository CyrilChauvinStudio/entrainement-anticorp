<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ANTICORP">
<meta name="theme-color" content="#161513">
<title>ANTICORP — Entraînement au pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0EBDD;
    --paper-dark:#E4DDC8;
    --ink:#161513;
    --red:#CC0000;
    --red-dark:#910000;
    --line:#161513;
    --ok:#2F5D3A;
    --warn:#8A5A00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(var(--ink) 0.5px, transparent 0.5px);
    background-size: 14px 14px;
    background-attachment: fixed;
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Header / masthead ---------- */
  .masthead{
    border-bottom:4px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:18px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    font-family:'Anton', sans-serif;
    font-size:38px;
    line-height:0.85;
    letter-spacing:0.5px;
  }
  .brand .anti{color:var(--red);}
  .brand .corp{color:var(--ink);}
  .brand-sub{
    font-size:10.5px;
    letter-spacing:0.06em;
    margin-top:4px;
    color:var(--ink);
    opacity:0.75;
  }
  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--red);
    border:2px solid var(--red);
    padding:4px 8px;
    transform:rotate(4deg);
    white-space:nowrap;
  }

  /* ---------- Dashboard ---------- */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .stat{
    border:2px solid var(--ink);
    padding:10px 8px;
    background:var(--paper);
  }
  .stat .n{font-family:'Anton',sans-serif;font-size:26px;line-height:1;}
  .stat .l{font-size:9.5px;letter-spacing:0.04em;margin-top:4px;opacity:0.8;}

  .panel{
    border:3px solid var(--ink);
    background:var(--paper);
    padding:16px;
    margin-bottom:16px;
    position:relative;
  }
  .panel-title{
    font-family:'Anton',sans-serif;
    font-size:16px;
    letter-spacing:0.02em;
    margin:0 0 8px;
  }
  .panel p{font-size:13px;line-height:1.55;margin:0 0 10px;}

  .btn{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.02em;
    padding:12px 16px;
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    cursor:pointer;
    text-align:center;
    width:100%;
    margin-bottom:10px;
    transition:transform 0.05s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--red);border-color:var(--red-dark);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.small{width:auto;padding:8px 12px;font-size:11.5px;margin-bottom:0;}
  .btn:disabled{opacity:0.45;cursor:default;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .row .btn{flex:1;}

  .cat-list{display:flex;flex-direction:column;gap:8px;}
  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:2px solid var(--ink);
    padding:9px 11px;
    font-size:12.5px;
    cursor:pointer;
    background:var(--paper);
  }
  .cat-item .badge{
    font-family:'Anton',sans-serif;
    font-size:13px;
    color:var(--red);
    min-width:24px;
    text-align:right;
  }

  /* ---------- Question / interrogation screen ---------- */
  .persona{
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:700;
    margin-bottom:6px;
  }
  .question-text{
    font-family:'Anton',sans-serif;
    font-size:21px;
    line-height:1.22;
    margin:0 0 14px;
  }
  textarea{
    width:100%;
    min-height:130px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    line-height:1.5;
    padding:10px;
    border:2px solid var(--ink);
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  textarea:focus{outline:2px solid var(--red);outline-offset:-2px;}
  .char-count{font-size:10px;opacity:0.6;margin:4px 0 12px;text-align:right;}

  .voice-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .mic-btn{
    display:flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;
    padding:10px 14px;border:2px solid var(--ink);background:var(--paper);
    cursor:pointer;flex:1;justify-content:center;
  }
  .mic-btn.recording{background:var(--red);border-color:var(--red-dark);color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.65;}100%{opacity:1;}}
  .mic-dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .voice-toggle{
    font-size:11px;letter-spacing:0.03em;background:transparent;border:1.5px solid var(--ink);
    padding:7px 10px;cursor:pointer;font-family:'IBM Plex Mono',monospace;color:var(--ink);opacity:0.85;
  }
  .voice-toggle.off{opacity:0.4;text-decoration:line-through;}
  .voice-note{font-size:10.5px;opacity:0.6;margin:0 0 10px;line-height:1.5;}

  .history-item{border:2px solid var(--ink);padding:9px 11px;margin-bottom:8px;background:var(--paper);}
  .history-item .h-top{display:flex;justify-content:space-between;font-size:10.5px;opacity:0.65;margin-bottom:5px;}
  .history-item .h-q{font-size:12.5px;line-height:1.5;margin-bottom:5px;}
  .history-item .h-a{font-size:12px;line-height:1.5;opacity:0.85;border-left:3px solid var(--paper-dark);padding-left:8px;}
  .h-score{font-family:'Anton',sans-serif;font-size:14px;}
  .h-score.ok{color:var(--ok);}
  .h-score.mid{color:var(--warn);}
  .h-score.low{color:var(--red);}

  .loading{
    font-size:12.5px;
    padding:14px 0;
    text-align:center;
    letter-spacing:0.04em;
  }
  .loading::after{
    content:'';
    display:inline-block;
    width:10px;
  }

  /* ---------- Eval result ---------- */
  .verdict-box{
    border:2px dashed var(--ink);
    padding:12px;
    margin:10px 0 14px;
    background:var(--paper-dark);
  }
  .verdict-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.7;margin-bottom:5px;}
  .verdict-quote{font-style:normal;font-size:13.5px;line-height:1.55;}
  .score-row{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;}
  .score-num{font-family:'Anton',sans-serif;font-size:30px;}
  .score-num.ok{color:var(--ok);}
  .score-num.mid{color:var(--warn);}
  .score-num.low{color:var(--red);}
  .score-label{font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
  .feedback-list{margin:0 0 14px;padding-left:18px;font-size:13px;line-height:1.6;}
  .feedback-list li{margin-bottom:5px;}
  .model-answer{
    border-left:4px solid var(--red);
    padding:10px 0 10px 12px;
    font-size:13px;
    line-height:1.6;
    margin:0 0 6px;
  }
  .model-answer-label{
    font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--red);
    font-weight:700;margin-bottom:6px;
  }

  .error-box{
    border:2px solid var(--red);
    color:var(--red-dark);
    padding:10px;
    font-size:12.5px;
    margin-bottom:12px;
  }

  .back-link{
    display:inline-block;
    font-size:11.5px;
    letter-spacing:0.03em;
    margin-bottom:14px;
    cursor:pointer;
    text-decoration:underline;
    opacity:0.75;
  }

  .progress-dots{display:flex;gap:5px;margin-bottom:14px;}
  .dot{width:9px;height:9px;border:1.5px solid var(--ink);}
  .dot.done-ok{background:var(--ok);border-color:var(--ok);}
  .dot.done-low{background:var(--red);border-color:var(--red-dark);}
  .dot.current{background:var(--ink);}

  .hidden{display:none;}

  select{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:8px;
    border:2px solid var(--ink);
    background:#fff;
    width:100%;
    margin-bottom:10px;
  }

  footer.note{
    font-size:10.5px;
    opacity:0.55;
    text-align:center;
    margin-top:24px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   DONNÉES DE CONNAISSANCE ANTICORP (contexte pour l'évaluateur)
   ============================================================ */
const ANTICORP_CONTEXT = `
MARQUE : ANTICORP. Baseline officielle : « ANTICORP, pubs B2B anti-bullshit ».
Fondateur/porteur : Cyril Chauvin — mais la marque ne se présente JAMAIS sous son nom, uniquement "ANTICORP".

POSITIONNEMENT :
- ANTICORP n'est PAS une agence ni une "anti-agence" : c'est un STUDIO.
- Distinction clé : les "vidéos" B2B (corporate, institutionnelles, même émotionnelles) INFORMENT — c'est ce qu'ANTICORP dénonce. ANTICORP fait des PUBS et des FILMS : des objets à l'esthétique de cinéma, qui attrapent l'audience, la marquent, l'impriment, la mettent en mouvement. Le mot "vidéo" reste donc AUTORISÉ dans le discours (notamment pour désigner ce qu'on dénonce, ou le média en général) ; simplement, les productions d'ANTICORP sont des films / des pubs, pas des vidéos informatives.
- Cible : PME B2B 50-500 salariés, Sud-Est France, dirigeants / directeurs marketing qui aiment l'humour intelligent.
- ANTICORP est une marque anti-bullshit : refuse le langage vide, les promesses floues, les superlatifs automatiques. On ne "vend" pas : on se fait acheter. Pas de ton commercial forcé, pas d'"offre exceptionnelle". Sélection, exigence, clarté, confiance calme (on attire, on ne chasse pas).
- Cadence : 10 pubs B2B par an, plafond révisable en cas de succès (encore faut-il l'atteindre). C'est un cap de production réaliste, PAS un argument de rareté ni de prestige : ne jamais le présenter comme « pas une de plus ». Le reste du temps : préparation d'idées qui claquent.
- Prix : le Build (stratégie + scripts) démarre à partir de 5 000 € ; le Run (campagne complète jusqu'à diffusion) à partir de 25 000 € ; ce qui est payé au Build se déduit du Run (on ne paie jamais deux fois). Durée : « plus que vous ne l'espérez, moins que vous ne le craignez » — pas de chiffre promis.
- Format des films : entre 15 secondes et 2 minutes, conçus pour être regardés jusqu'au bout, pas juste diffusés.

MÉTHODE EN 3 PHASES (c'est LA structure officielle du site ; à respecter si on la décrit) :
PHASE 1 — ON CREUSE : une étude menée par des spécialistes. Ils passent le secteur aux rayons X (ses codes, ses tics de langage, ses idées reçues, ses habitudes que plus personne ne questionne), regardent l'entreprise dans son décor (d'où elle vient, ce qu'elle bouscule, ce qu'elle règle pour ses clients) et posent la seule question qui compte : pourquoi elle existe. De ce forage sortent des idées. UNE SEULE IDÉE PAR FILM : s'il y en a plusieurs, il y aura plusieurs films. Pas les plus jolies : les plus vraies.
PHASE 2 — ON FABRIQUE : on tourne le vrai (de vrais visages, un vrai jeu, une vraie présence : aucune machine ne le fabrique). Chaque plan sert l'idée, ou il dégage (pas de drone de remplissage, pas de plan clavier). Ensuite, techniques hybrides tournage + IA : n'importe quel lieu, n'importe quelle époque, n'importe quel décor. « Trop cher » et « pas possible » sortent de la conversation. Le jeu reste humain, le monde autour est imaginé sans limite.
PHASE 3 — ON ARME : on ne livre pas un film, on l'arme. On prépare où, quand et comment il sort, pour qu'il touche les bonnes personnes (pas seulement le service com). Deux cas : le client a déjà ses canaux, on l'arme de prescriptions précises ; il n'a rien en place, ANTICORP prend la diffusion en charge. Dans les deux cas on mesure, au cas par cas, sur les indicateurs qui comptent pour SES objectifs (notoriété, vues qualifiées, complétion, contacts générés), pas des « retours sympas ». Les déclinaisons (photo, formats, etc.) relèvent de cette phase : on décide ce dont le film a besoin pour être diffusé et exploité. Ligne rouge : ANTICORP refuse de faire un film qui ne sera pas diffusé.
BUILD & RUN (le cadre commercial qui rassure ceux qui ont peur de se tromper) : le BUILD = on pose la stratégie et on écrit les scripts ; le client voit le film (l'idée, le ton, la promesse) avant qu'il coûte un seul jour de tournage ; si ça ne lui parle pas, on s'arrête là. Le RUN = on produit, on réalise, on prescrit la diffusion, on mesure. Ce qui a été payé au Build se déduit du Run. Le client engage la confiance avant le budget.
RÈGLE D'ÉVALUATION SUR LES PHASES : le porteur de projet n'a PAS besoin de prononcer « phase 1/2/3 » ni les noms exacts. Juge si le CONTENU est rangé dans la bonne phase (ou décrit sans la nommer) ; ne retire jamais de points uniquement parce qu'il n'a pas cité un numéro de phase. Ne pénalise qu'une vraie erreur (ex : dire qu'on tourne pendant la phase d'étude, ou oublier que la mesure fait partie de l'armement).

TON DE LA MARQUE : drôle, percutant, intelligent, impertinent, féroce, disruptif. Critique constructive du corporate SANS donner de leçons. Critique les formats, pas les clients. Respectueux du bon travail même concurrent. Honnête : "nous ne convenons pas à tout le monde". Humour toujours intelligent et incisif — jamais clown, jamais gênant. Derrière l'humour : une méthode irréprochable (on peut plaisanter sur la forme, jamais sur la rigueur).

CE QU'ANTICORP NE FAIT PAS : solutions synergiques et bullshit corporate, collaborateurs qui rient faux, musiques dramatiques sur logiciels de comptabilité, "Depuis 1987...", "l'humain au cœur de nos solutions transformationnelles", des vidéos informatives (qui n'informent que le service com).

INTERDITS ABSOLUS DANS LE DISCOURS ANTICORP (une bonne réponse ne doit jamais contenir) :
- Aucune date calendaire ni année précise (pas de "depuis 1987", pas de "en 2003"). EN REVANCHE, l'ancienneté du fondateur est AUTORISÉE et même encouragée : 25 ans d'expérience dans la réalisation de films corporate — 25 ans d'expérience du bullshit — c'est le déclencheur et la justification de la création d'ANTICORP.
- Aucune mention de "trilogie créative" (notion abandonnée).
- Aucune liste de styles de réalisateurs connus (Tarantino, Wes Anderson, etc.) ni de "12 styles".
- Aucune promesse de "style signature" figé — chaque client doit sentir que SON film aura SON propre style.

DONNÉES B2B DOCUMENTÉES (à mobiliser si pertinent, sans en abuser) :
- Attention humaine moyenne : 8,25 secondes (Microsoft, 2015).
- Sites B2B avec vidéo : +65% de conversion (Swell AI, 2025).
- 52% des marketeurs B2B jugent la vidéo comme meilleur ROI (Smart Insights, 2024).
- Vidéos de moins de 30 secondes : 200% de completion en plus sur LinkedIn.
- 93% des décideurs B2B disent que la vidéo influence leur décision d'achat (Wyzowl, 2024).
- Neurosciences de l'humour : l'humour active le système de récompense dopaminergique (nucleus accumbens), rend le contenu 3 à 5 fois plus mémorable (encodage élaboratif) et abaisse les défenses/le scepticisme du spectateur. L'humour publicitaire le plus durable est celui qui laisse le spectateur compléter la révélation lui-même ("a smile in the mind", concept de McAlhone & Stuart).

MANIFESTE (esprit à retenir, jamais à réciter mot pour mot) : 25 ans de films corporate B2B propres, bien cadrés, livrés à l'heure — regardés seulement par le service com et personne d'autre. Le script classique (interview dirigeant, "ateliers", "proximité terrain", salle vitrée, drone coucher de soleil sur le siège, "Depuis 1987 nous accompagnons...") ne sert à rien : il ne change l'avis de personne et n'est pas mesurable. Le vrai problème n'est pas le format classique, c'est la PEUR de sortir du cadre sécurisant. ANTICORP répond par des pubs B2B drôles, surprenantes, précises et mesurées — sans drone de remplissage, sans effet waouh flou, juste des films qui servent.
`;

/* ============================================================
   BANQUE DE QUESTIONS — LE DIRIGEANT (équipe rouge)
   ============================================================ */
const CATEGORIES = [
  {id:'positionnement', label:'Positionnement'},
  {id:'risque', label:'Risque & crédibilité'},
  {id:'prix', label:'Prix & ROI'},
  {id:'methode', label:'Méthode & process'},
  {id:'preuve', label:'Preuve & mesure'},
  {id:'marque', label:'Marque & nom'},
];

const PERSONAS = [
  "Le dirigeant, sceptique, bras croisés",
  "La directrice marketing, pressée, regarde sa montre",
  "Le DAF, tatillon sur le budget",
  "Le dirigeant, technique, veut du concret",
  "La dirigeante, agacée par les agences en général",
  "Le dirigeant, qui a déjà tout essayé",
];

const QUESTIONS = [
  {id:'q01', cat:'positionnement', q:"Une agence, un studio, une boîte de prod... c'est pareil non ? Pourquoi vous m'embêtez avec ce mot \"studio\" ?"},
  {id:'q02', cat:'positionnement', q:"Vous dénoncez les vidéos corporate. Mais ce que vous allez me livrer, c'est un fichier vidéo aussi, non ? Où est la différence ?"},
  {id:'q03', cat:'positionnement', q:"L'humour en B2B, très franchement, ça me fait peur. Mes clients sont des industriels sérieux. Pourquoi je prendrais ce risque ?"},
  {id:'q04', cat:'positionnement', q:"Vous vous adressez à qui exactement ? Parce que \"les PME qui aiment l'humour\", ça ne veut rien dire, tout le monde aime rire."},
  {id:'q05', cat:'risque', q:"Et si mon film fait rire mais qu'il ne vend rien ? Vous me garantissez quoi, concrètement ?"},
  {id:'q06', cat:'risque', q:"Mes équipes commerciales vont me dire que c'est too much, que ça décrédibilise l'entreprise. Vous répondez quoi ?"},
  {id:'q07', cat:'risque', q:"Vous n'avez encore aucun client ANTICORP. Comment je vous fais confiance sur un exercice aussi casse-gueule que l'humour ?"},
  {id:'q08', cat:'risque', q:"Un film drôle, ça peut aussi braquer un client. Vous mesurez ce risque comment avant de tourner ?"},
  {id:'q09', cat:'risque', q:"Si le ton tombe à plat, si personne ne rit, qui porte la responsabilité ? Vous ou moi ?"},
  {id:'q10', cat:'prix', q:"Une agence classique me fait un film \"institutionnel\" moins cher. Pourquoi je paierais plus pour de l'humour ?"},
  {id:'q11', cat:'prix', q:"Vous plafonnez à 10 pubs par an. Donc soit c'est hors de prix, soit vous n'êtes pas scalable. Lequel des deux ?"},
  {id:'q12', cat:'prix', q:"C'est quoi le ROI réel d'un film de 30 secondes sur LinkedIn pour une PME industrielle comme la mienne ?"},
  {id:'q13', cat:'prix', q:"Vous me parlez de \"confiance calme\", de \"on ne vend pas\"... très bien, mais alors comment je sais ce que ça va me coûter ?"},
  {id:'q14', cat:'methode', q:"Concrètement, de la première réunion à la diffusion, ça se passe comment ? Donnez-moi les étapes, sans blabla."},
  {id:'q15', cat:'methode', q:"Vous me proposez combien d'options créatives avant de trancher, et qui tranche à la fin, vous ou moi ?"},
  {id:'q16', cat:'methode', q:"Et si je veux une déclinaison photo en plus du film, ça s'intègre où dans votre process ?"},
  {id:'q17', cat:'methode', q:"Qu'est-ce qui se passe si l'idée retenue à l'écriture ne me plaît pas du tout au tournage ?"},
  {id:'q18', cat:'preuve', q:"Vous avez des chiffres sérieux, ou c'est encore une histoire de \"tendance\" vidéo qu'on nous ressert depuis dix ans ?"},
  {id:'q19', cat:'preuve', q:"Comment vous prouvez qu'un film drôle est plus mémorable qu'un film institutionnel classique ? Vous avez des sources ?"},
  {id:'q20', cat:'preuve', q:"\"93% des décideurs B2B influencés par la vidéo\", très bien, mais toutes les vidéos, même les mauvaises. Ça prouve quoi pour vous ?"},
  {id:'q21', cat:'preuve', q:"Après diffusion, vous mesurez quoi précisément ? Des vues, ou autre chose de plus sérieux ?"},
  {id:'q22', cat:'marque', q:"Pourquoi je ne vois jamais votre nom, Cyril Chauvin, dans tout ça ? Vous avez honte de votre propre expertise ?"},
  {id:'q23', cat:'marque', q:"ANTI-corp, c'est un nom assez agressif. Vous n'avez pas peur de braquer les entreprises que vous ciblez, justement ?"},
  {id:'q24', cat:'marque', q:"Vous vous positionnez \"anti-bullshit\" contre le corporate... mais vous restez une entreprise qui vend un service. Un peu hypocrite, non ?"},
  {id:'q25', cat:'marque', q:"C'est quoi votre \"style\" à vous ? Je veux voir la patte ANTICORP avant de signer."},
  {id:'q26', cat:'positionnement', q:"Umault, en Belgique, fait déjà ça très bien. Vous êtes juste la copie française ?"},
  {id:'q27', cat:'positionnement', q:"30 secondes, une minute... c'est trop court pour expliquer un produit B2B complexe comme le mien."},
  {id:'q28', cat:'risque', q:"Vous dites \"on ne convient pas à tout le monde\". Ça veut dire que vous refusez des clients ? Sur quels critères ?"},
  {id:'q29', cat:'prix', q:"Concrètement, qu'est-ce qui coûte cher chez vous : l'idée, le tournage, ou la stratégie de diffusion ?"},
  {id:'q30', cat:'methode', q:"Combien de temps entre le brief et la diffusion réelle du film ? Je n'ai pas six mois devant moi."},
  {id:'q31', cat:'preuve', q:"Vous n'avez pas encore lancé ANTICORP. De quel droit vous me parlez de mesure d'impact avant même d'avoir un cas client ?"},

    stats: { sessionsCount:0, lastSessionDate:null, pitchAttempts:0, pitchBestScore:0 },
  };

async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const prog = JSON.parse(raw);
      // Migration : recalcule les échéances avec le nouveau rythme (30 j / 90 j)
      Object.values(prog.questions || {}).forEach(st=>{
        if(st.box >= 1){
          st.box = Math.min(st.box, BOX_DELAYS_DAYS.length - 1);
          const last = st.history && st.history.length ? st.history[st.history.length-1].date : null;
          if(last){
            const d = new Date(last);
            d.setDate(d.getDate() + BOX_DELAYS_DAYS[st.box]);
            st.nextDue = d.toISOString();
          }
        }
      });
      return prog;
    }
    return emptyProgress();
  }catch(e){
    return emptyProgress();
  }
}

}

/* ============================================================
   RÉPÉTITION ESPACÉE (Leitner simplifié)
   ============================================================ */
const BOX_DELAYS_DAYS = [0, 30, 90]; // box0 = raté (à revoir vite) ; 4/5 ou plus = revu dans 30 j, puis 90 j

function ensureQState(progress, id){
  if(!progress.questions[id]){
    progress.questions[id] = {box:0, nextDue:null, attempts:0, lastScore:null, lastAnswer:null, history:[]};
  }
  return progress.questions[id];
}

function pushLog(progress, entry){
  if(!progress.log) progress.log = [];
  progress.log.unshift(entry);
  if(progress.log.length > 30) progress.log = progress.log.slice(0,30);
}

function isDue(qstate){
  if(!qstate.nextDue) return true; // jamais vue
  return new Date(qstate.nextDue) <= new Date();
}

function applyResult(progress, id, score, answerText){
  const st = ensureQState(progress, id);
  st.attempts += 1;
  st.lastScore = score;
  st.lastAnswer = (answerText||'').slice(0,600);
  st.history.push({date:new Date().toISOString(), score});
  if(st.history.length > 8) st.history = st.history.slice(-8);

  if(score >= 4){
    st.box = Math.min(st.box + 1, BOX_DELAYS_DAYS.length - 1);
  } else {
    st.box = 0;
  }
  const days = BOX_DELAYS_DAYS[st.box];
  const due = new Date();
  due.setDate(due.getDate() + days);
  st.nextDue = due.toISOString();
  return st;
}

function buildSessionQueue(progress, count){
  const due = [];
  const fresh = [];
  QUESTIONS.forEach(q=>{
    const st = progress.questions[q.id];
    if(!st){ fresh.push(q); }
    else if(isDue(st)){ due.push({q, box:st.box}); }
  });
  due.sort((a,b)=> a.box - b.box); // box0 (échecs) en premier
  let queue = due.map(d=>d.q);
  // compléter avec des questions jamais vues
  fresh.sort(()=>Math.random()-0.5);
  for(const q of fresh){
    if(queue.length >= count) break;
    if(!queue.find(x=>x.id===q.id)) queue.push(q);
  }
  // si toujours pas assez, compléter avec des questions déjà maîtrisées au hasard
  if(queue.length < count){
    const rest = QUESTIONS.filter(q=>!queue.find(x=>x.id===q.id));
    rest.sort(()=>Math.random()-0.5);
    for(const q of rest){
      if(queue.length >= count) break;
      queue.push(q);
    }
  }
  return queue.slice(0, count);
}

   ============================================================ */
async function callClaude(systemPrompt, userPrompt){
  const key = getApiKey();
  const headers = {"Content-Type": "application/json"};
  if(key){
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{role:"user", content:userPrompt}],
    })
  });
  if(response.status === 401){
    throw new Error("Clé API manquante ou invalide. Réglages → clé API.");
  }
  if(!response.ok){
    throw new Error("Erreur API (" + response.status + ")");
  }
  const data = await response.json();
  const textBlock = data.content.find(b=>b.type==="text");
  if(!textBlock) throw new Error("Réponse vide");
  return textBlock.text;
}

function parseJsonLoose(text){
  const cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  const slice = (start>=0 && end>=0) ? cleaned.slice(start, end+1) : cleaned;
  return JSON.parse(slice);
}

/* ============================================================
   VOIX — reconnaissance vocale (micro) & synthèse (lecture)
   ============================================================ */
const SR_CLASS = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const TTS_SUPPORTED = !!window.speechSynthesis;
let recognition = null;
let recognizing = false;
let recBaseText = '';
let recTargetId = null;

function micSupported(){ return !!SR_CLASS; }

function startRecording(targetId){
  if(!micSupported()) return;
  window.speechSynthesis && window.speechSynthesis.cancel();
  const ta = document.getElementById(targetId);
  recTargetId = targetId;
  recBaseText = ta.value ? (ta.value.trim() + ' ') : '';
  recognition = new SR_CLASS();
  recognition.lang = 'fr-FR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event)=>{
    let finalT = '', interimT = '';
    for(let i=0;i<event.results.length;i++){
      const r = event.results[i];
      if(r.isFinal) finalT += r[0].transcript;
      else interimT += r[0].transcript;
    }
    const ta2 = document.getElementById(recTargetId);
    if(ta2){
      ta2.value = (recBaseText + finalT + interimT).trim();
      const cc = document.getElementById('char-count');
      if(cc){
        const words = ta2.value.trim() ? ta2.value.trim().split(/\s+/).length : 0;
        cc.textContent = ta2.value.length + ' caractères · ~' + words + ' mots';
      }
      STATE.draftAnswer = ta2.value;
    }
  };
  recognition.onerror = (e)=>{
    recognizing = false;
    updateMicButton();
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      STATE.errorMsg = "Micro refusé par le navigateur. Autorisez l'accès au micro, ou répondez au clavier.";
      render();
    }
  };
  recognition.onend = ()=>{
    recognizing = false;
    updateMicButton();
  };

  try{
    recognition.start();
    recognizing = true;
    updateMicButton();
  }catch(e){
    recognizing = false;
  }
}

function stopRecording(){
  if(recognition && recognizing){ recognition.stop(); }
  recognizing = false;
  updateMicButton();
}

function updateMicButton(){
  const btn = document.getElementById('mic-btn');
  if(!btn) return;
  if(recognizing){
    btn.classList.add('recording');
    btn.innerHTML = '<span class="mic-dot"></span> ENREGISTREMENT — TOUCHEZ POUR ARRÊTER';
  } else {
    btn.classList.remove('recording');
    btn.innerHTML = '<span class="mic-dot"></span> PARLER MA RÉPONSE';
  }
}

function speakText(text){
  if(!TTS_SUPPORTED || !STATE.voiceOn) return;
  try{
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_#]/g,'');
    const utt = new SpeechSynthesisUtterance(clean);
    utt.lang = 'fr-FR';
    utt.rate = 1.0;
    window.speechSynthesis.speak(utt);
  }catch(e){ /* silencieux */ }
}

function stopSpeaking(){
  if(TTS_SUPPORTED) window.speechSynthesis.cancel();
}

function scoreClass(score){
  if(score >= 4) return 'ok';
  if(score === 3) return 'mid';
  return 'low';
}

function fmtDue(iso){
  if(!iso) return "jamais vue";
  const d = new Date(iso);
  const now = new Date();
  if(d <= now) return "à revoir maintenant";
  const days = Math.ceil((d-now)/(1000*60*60*24));
  return "dans " + days + " j";
}

/* Effets de bord : lit à voix haute la question ou le verdict une seule fois par nouveauté */
function afterRender(){
  const vt = document.getElementById('voice-toggle-btn');
  if(vt){
    vt.onclick = ()=>{
      STATE.voiceOn = !STATE.voiceOn;
      if(!STATE.voiceOn) stopSpeaking();
      render();
    };
  }
  if(!STATE.voiceOn || !TTS_SUPPORTED) return;
  if(STATE.screen === 'session'){
    const isSurprise = !!STATE.currentSurprise && STATE.currentSurprise !== 'loading';
    if(STATE.currentSurprise === 'loading') return;
    const q = isSurprise ? STATE.currentSurprise.question : (STATE.sessionQueue[STATE.sessionIndex] ? STATE.sessionQueue[STATE.sessionIndex].q : null);
    if(q && !STATE.currentEval){
      const key = 'q:'+q;
      if(STATE.lastSpokenKey !== key){ STATE.lastSpokenKey = key; speakText(q); }
    } else if(STATE.currentEval){
      const key = 'v:'+STATE.currentEval.verdict;
      if(STATE.lastSpokenKey !== key){ STATE.lastSpokenKey = key; speakText(STATE.currentEval.verdict); }
    }
  } else if(STATE.screen === 'pitch'){
    if(!STATE.currentEval){
      const key = 'pitchq';
      if(STATE.lastSpokenKey !== key){ STATE.lastSpokenKey = key; speakText("Vous avez 60 secondes. Vendez-moi ANTICORP."); }
    } else {
      const key = 'v:'+STATE.currentEval.verdict;
      if(STATE.lastSpokenKey !== key){ STATE.lastSpokenKey = key; speakText(STATE.currentEval.verdict); }
    }
  } else {
    stopSpeaking();
  }
}

    const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

      <div class="h-top"><span>${dateStr} · ${e.type==='pitch'?'Pitch':e.type==='surprise'?'Question surprise':'Question'}</span><span class="h-score ${cls}">${e.score}/5</span></div>
      <div class="h-q">« ${e.question} »</div>
      <div class="h-a">${e.answer}</div>
    </div>`;
  }).join('');
  return `
  <div class="back-link" id="back-home">‹ retour</div>
  <div class="panel">
    <p class="panel-title">HISTORIQUE</p>
    ${items}
  </div>`;
}

function attachHistoryHandlers(){
  document.getElementById('back-home').onclick = ()=>{ STATE.screen='home'; render(); };
}

function renderCategories(){
  const p = STATE.progress;
  let items = CATEGORIES.map(c=>{
    const qs = QUESTIONS.filter(q=>q.cat===c.id);
    const due = qs.filter(q=>{ const st=p.questions[q.id]; return !st || isDue(st); }).length;
    return `<div class="cat-item" data-cat="${c.id}"><span>${c.label} <span style="opacity:0.55">(${qs.length})</span></span><span class="badge">${due}</span></div>`;
  }).join('');
  return `
  <div class="back-link" id="back-home">‹ retour</div>
  <div class="panel">
    <p class="panel-title">CATÉGORIES</p>
    <p>Le chiffre à droite = questions à revoir dans cette catégorie.</p>
    <div class="cat-list">${items}</div>
  </div>`;
}

function attachCategoriesHandlers(){
  document.getElementById('back-home').onclick = ()=>{ STATE.screen='home'; render(); };
  document.querySelectorAll('.cat-item').forEach(el=>{
    el.onclick = ()=> startSession(el.getAttribute('data-cat'));
  });
}

function startSession(catFilter){
  const pool = catFilter ? QUESTIONS.filter(q=>q.cat===catFilter) : QUESTIONS;
  const dueInPool = [];
  const freshInPool = [];
  pool.forEach(q=>{
    const st = STATE.progress.questions[q.id];
    if(!st){ freshInPool.push(q); }
    else if(isDue(st)){ dueInPool.push({q, box:st.box}); }
  });
  dueInPool.sort((a,b)=>a.box-b.box);
  let queue = dueInPool.map(d=>d.q);
  freshInPool.sort(()=>Math.random()-0.5);
  const target = catFilter ? pool.length : 8;
  for(const q of freshInPool){
    if(queue.length>=target) break;
    queue.push(q);
  }
  if(queue.length===0){ queue = [...pool].sort(()=>Math.random()-0.5).slice(0, catFilter?pool.length:8); }

  STATE.sessionQueue = queue;
  STATE.sessionIndex = 0;
  STATE.sessionResults = [];
  STATE.currentEval = null;
  STATE.errorMsg = null;
  STATE.screen = 'session';
  render();
}

function startSurprise(){
  STATE.sessionQueue = [];
  STATE.sessionIndex = 0;
  STATE.sessionResults = [];
  STATE.currentEval = null;
  STATE.currentSurprise = 'loading';
  STATE.errorMsg = null;
  STATE.screen = 'session';
  render();
  generateSurpriseQuestion().then(res=>{
    STATE.currentSurprise = res;
    render();
  }).catch(err=>{
    STATE.currentSurprise = null;
    STATE.errorMsg = "Le dirigeant n'a pas pu improviser de question (" + err.message + "). Réessayez.";
    render();
  });
}

function renderSession(){
  if(STATE.currentSurprise === 'loading'){
    return `<div class="back-link" id="back-home">‹ retour</div><div class="loading">LE DIRIGEANT RÉFLÉCHIT…</div>`;
  }

  const isSurprise = !!STATE.currentSurprise && STATE.currentSurprise !== 'loading';
  const q = isSurprise ? STATE.currentSurprise.question : (STATE.sessionQueue[STATE.sessionIndex] ? STATE.sessionQueue[STATE.sessionIndex].q : null);
  const personaLabel = isSurprise ? STATE.currentSurprise.persona : PERSONAS[STATE.sessionIndex % PERSONAS.length];

  if(!q && !isSurprise){
    // session terminée
    const avg = STATE.sessionResults.length ? (STATE.sessionResults.reduce((a,b)=>a+b.score,0)/STATE.sessionResults.length).toFixed(1) : '—';
    return `
    <div class="back-link" id="back-home">‹ retour</div>
    <div class="panel">
      <p class="panel-title">SESSION TERMINÉE</p>
      <p>Score moyen de la session : <strong>${avg}/5</strong> sur ${STATE.sessionResults.length} question(s).</p>
      <p>Les questions ratées reviendront plus tôt. Continuez demain pour ancrer les automatismes.</p>
      <button class="btn primary" id="btn-again">Refaire une session</button>
      <button class="btn ghost" id="btn-home2">Retour à l'accueil</button>
    </div>`;
  }

  let dots = '';
  if(!isSurprise){
    dots = `<div class="progress-dots">` + STATE.sessionQueue.map((sq,i)=>{
      const r = STATE.sessionResults.find(x=>x.id===sq.id && x.idx===i);
      let cls = 'dot';
      if(i < STATE.sessionIndex){
        const res = STATE.sessionResults[i];
        cls += res && res.score>=4 ? ' done-ok' : ' done-low';
      } else if(i === STATE.sessionIndex){
        cls += ' current';
      }
      return `<div class="${cls}"></div>`;
    }).join('') + `</div>`;
  }

  let body = `
    <div class="back-link" id="back-home">‹ retour</div>
    ${dots}
    <div class="panel">
      <div class="persona">${personaLabel}</div>
      <p class="question-text">« ${q} »</p>
  `;

  if(STATE.currentEval){
    body += renderEvalBlock(STATE.currentEval);
    body += `<div class="row">
        <button class="btn primary" id="btn-next">Question suivante</button>
      </div>`;
  } else {
    body += `
      ${micSupported() ? `
      <div class="voice-row">
        <button class="mic-btn" id="mic-btn"><span class="mic-dot"></span> PARLER MA RÉPONSE</button>
      </div>
      <p class="voice-note">Touchez pour parler, touchez à nouveau pour arrêter. Le texte apparaît au fur et à mesure — corrigez-le si besoin avant d'envoyer.</p>
      ` : `<p class="voice-note">Reconnaissance vocale non disponible sur ce navigateur — répondez au clavier.</p>`}
      <textarea id="answer-box" placeholder="Ou tapez ici ce que vous diriez à l'oral…">${STATE.draftAnswer||''}</textarea>
      <div class="char-count" id="char-count">0 caractère</div>
      ${STATE.errorMsg ? `<div class="error-box">${STATE.errorMsg}</div>` : ''}
      ${STATE.loadingEval ? `<div class="loading">LE DIRIGEANT ÉVALUE VOTRE RÉPONSE…</div>` : `
      <div class="row">
        <button class="btn primary" id="btn-submit">Soumettre la réponse</button>
      </div>`}
    `;
  }
  body += `</div>`;
  return body;
}

function renderEvalBlock(ev){
  const cls = scoreClass(ev.score);
  const fortsHtml = (ev.points_forts||[]).map(x=>`<li>${x}</li>`).join('');
  const faiblesHtml = (ev.points_faibles||[]).map(x=>`<li>${x}</li>`).join('');
  return `
    <div class="verdict-box">
      <div class="verdict-label">Réaction du dirigeant</div>
      <div class="verdict-quote">« ${ev.verdict} »</div>
    </div>
    <div class="score-row">
      <span class="score-num ${cls}">${ev.score}/5</span>
      <span class="score-label">${ev.score>=4?'Convaincant':ev.score===3?'Moyen, à muscler':'Insuffisant'}</span>
    </div>
    ${fortsHtml ? `<div><strong style="font-size:12px;">Points forts</strong><ul class="feedback-list">${fortsHtml}</ul></div>` : ''}
    ${faiblesHtml ? `<div><strong style="font-size:12px;">À corriger</strong><ul class="feedback-list">${faiblesHtml}</ul></div>` : ''}
    <div class="model-answer">
      <div class="model-answer-label">Réponse modèle</div>
      ${ev.reponse_modele}
    </div>
  `;
}

function attachSessionHandlers(){
  const back = document.getElementById('back-home');
  if(back) back.onclick = ()=>{ stopRecording(); stopSpeaking(); STATE.currentSurprise=null; STATE.screen='home'; render(); };

  const answerBox = document.getElementById('answer-box');
  if(answerBox){
    answerBox.oninput = (e)=>{
      STATE.draftAnswer = e.target.value;
      const cc = document.getElementById('char-count');
      if(cc) cc.textContent = e.target.value.length + ' caractères';
    };
  }

  const micBtn = document.getElementById('mic-btn');
  if(micBtn){
    micBtn.onclick = ()=>{
      stopSpeaking();
      if(recognizing) stopRecording(); else startRecording('answer-box');
    };
  }

  const submitBtn = document.getElementById('btn-submit');
  if(submitBtn){
    submitBtn.onclick = async ()=>{
      stopRecording();
      const val = (document.getElementById('answer-box').value || '').trim();
      if(!val){ STATE.errorMsg = "Écrivez d'abord ce que vous diriez au dirigeant."; render(); return; }
      STATE.errorMsg = null;
      STATE.loadingEval = true;
      render();

      const isSurprise = !!STATE.currentSurprise && STATE.currentSurprise !== 'loading';
      const q = isSurprise ? STATE.currentSurprise.question : STATE.sessionQueue[STATE.sessionIndex].q;
      const personaLabel = isSurprise ? STATE.currentSurprise.persona : PERSONAS[STATE.sessionIndex % PERSONAS.length];

      try{
        const ev = await evaluateAnswer(q, personaLabel, val);
        STATE.currentEval = ev;
        STATE.loadingEval = false;
        STATE.draftAnswer = '';
        if(!isSurprise){
          const id = STATE.sessionQueue[STATE.sessionIndex].id;
          applyResult(STATE.progress, id, ev.score, val);
          STATE.sessionResults.push({id, score:ev.score, idx:STATE.sessionIndex});
        }
        pushLog(STATE.progress, {date:new Date().toISOString(), question:q, answer:val, score:ev.score, type: isSurprise ? 'surprise':'question'});
        await saveProgress(STATE.progress);
        render();
      }catch(err){
        STATE.loadingEval = false;
        STATE.errorMsg = "Erreur d'évaluation : " + err.message + ". Réessayez.";
        render();
      }
    };
  }

  const nextBtn = document.getElementById('btn-next');
  if(nextBtn){
    nextBtn.onclick = ()=>{
      STATE.currentEval = null;
      STATE.draftAnswer = '';
      if(STATE.currentSurprise && STATE.currentSurprise !== 'loading'){
        STATE.currentSurprise = null;
        STATE.screen = 'home';
      } else {
        STATE.sessionIndex += 1;
      }
      render();
    };
  }

  const againBtn = document.getElementById('btn-again');
  if(againBtn) againBtn.onclick = ()=> startSession(null);
  const home2 = document.getElementById('btn-home2');
  if(home2) home2.onclick = ()=>{ STATE.screen='home'; render(); };
}

function renderPitch(){
  let body = `
    <div class="back-link" id="back-home">‹ retour</div>
    <div class="panel">
      <div class="persona">Le dirigeant, montre en main</div>
      <p class="question-text">« Vous avez 60 secondes. Vendez-moi ANTICORP. »</p>
  `;
  if(STATE.currentEval){
    body += renderEvalBlock(STATE.currentEval);
    body += `<div class="row"><button class="btn primary" id="btn-pitch-again">Refaire le pitch</button></div>`;
  } else {
    body += `
      ${micSupported() ? `
      <div class="voice-row">
        <button class="mic-btn" id="mic-btn"><span class="mic-dot"></span> PARLER MA RÉPONSE</button>
      </div>
      <p class="voice-note">Touchez, dites votre pitch en 60 secondes, touchez à nouveau pour arrêter.</p>
      ` : `<p class="voice-note">Reconnaissance vocale non disponible sur ce navigateur — répondez au clavier.</p>`}
      <textarea id="pitch-box" placeholder="Ou tapez votre pitch tel que vous le diriez à l'oral…">${STATE.draftAnswer||''}</textarea>
      <div class="char-count" id="char-count">0 caractère · ~${0} mots</div>
      ${STATE.errorMsg ? `<div class="error-box">${STATE.errorMsg}</div>` : ''}
      ${STATE.loadingEval ? `<div class="loading">LE DIRIGEANT ÉCOUTE ET JUGE…</div>` : `
      <div class="row"><button class="btn primary" id="btn-pitch-submit">Soumettre le pitch</button></div>`}
    `;
  }
  body += `</div>`;
  return body;
}

function attachPitchHandlers(){
  document.getElementById('back-home').onclick = ()=>{ stopRecording(); stopSpeaking(); STATE.screen='home'; STATE.currentEval=null; render(); };
  const box = document.getElementById('pitch-box');
  if(box){
    box.oninput = (e)=>{
      STATE.draftAnswer = e.target.value;
      const words = e.target.value.trim() ? e.target.value.trim().split(/\s+/).length : 0;
      const cc = document.getElementById('char-count');
      if(cc) cc.textContent = e.target.value.length + ' caractères · ~' + words + ' mots';
    };
  }
  const micBtn = document.getElementById('mic-btn');
  if(micBtn){
    micBtn.onclick = ()=>{
      stopSpeaking();
      if(recognizing) stopRecording(); else startRecording('pitch-box');
    };
  }
  const submit = document.getElementById('btn-pitch-submit');
  if(submit){
    submit.onclick = async ()=>{
      stopRecording();
      const val = (document.getElementById('pitch-box').value || '').trim();
      if(!val){ STATE.errorMsg = "Écrivez d'abord votre pitch."; render(); return; }
      STATE.errorMsg = null;
      STATE.loadingEval = true;
      render();
      try{
        const ev = await evaluatePitch(val);
        STATE.currentEval = ev;
        STATE.loadingEval = false;
        STATE.draftAnswer = '';
        STATE.progress.stats.pitchAttempts += 1;
        if(ev.score > STATE.progress.stats.pitchBestScore) STATE.progress.stats.pitchBestScore = ev.score;
        pushLog(STATE.progress, {date:new Date().toISOString(), question:'Pitch 60 secondes', answer:val, score:ev.score, type:'pitch'});
        await saveProgress(STATE.progress);
        render();
      }catch(err){
        STATE.loadingEval = false;
        STATE.errorMsg = "Erreur d'évaluation : " + err.message + ". Réessayez.";
        render();
      }
    };
  }
  const again = document.getElementById('btn-pitch-again');
  if(again) again.onclick = ()=>{ STATE.currentEval=null; STATE.draftAnswer=''; render(); };
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  STATE.progress = await loadProgress();
  STATE.progress.stats.sessionsCount = (STATE.progress.stats.sessionsCount||0) + 1;
  STATE.progress.stats.lastSessionDate = new Date().toISOString();
  await saveProgress(STATE.progress);
  STATE.screen = 'home';
  render();
})();
</script>
